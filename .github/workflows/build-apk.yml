name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Compilar APK
        run: |
          unzip -q MiBibliotecaPersonal-CodigoFuente.zip -d proyecto
          cd proyecto
          gradle :app:assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: MiBibliotecaPersonal-apk
          path: proyecto/app/build/outputs/apk/debug/app-debug.apk
